<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="80" fill="#8CB89F"/>
  <g transform="translate(256, 256)">
    <!-- Nest base -->
    <ellipse cx="0" cy="60" rx="140" ry="50" fill="#8B6F47"/>
    <ellipse cx="0" cy="50" rx="120" ry="40" fill="#A67C52"/>
    
    <!-- House shape -->
    <path d="M0 -120 L100 -20 L100 60 L-100 60 L-100 -20 Z" fill="#FDFBF7"/>
    
    <!-- Roof -->
    <path d="M0 -140 L120 -20 L100 -20 L0 -120 L-100 -20 L-120 -20 Z" fill="#EE7C2B"/>
    
    <!-- Door -->
    <rect x="-25" y="0" width="50" height="60" rx="5" fill="#8CB89F"/>
    
    <!-- Window -->
    <rect x="35" y="-60" width="35" height="35" rx="5" fill="#87CEEB"/>
    <line x1="52.5" y1="-60" x2="52.5" y2="-25" stroke="#FDFBF7" stroke-width="3"/>
    <line x1="35" y1="-42.5" x2="70" y2="-42.5" stroke="#FDFBF7" stroke-width="3"/>
    
    <!-- Heart -->
    <path d="M0 -50 C-15 -70, -40 -60, -40 -40 C-40 -10, 0 10, 0 10 C0 10, 40 -10, 40 -40 C40 -60, 15 -70, 0 -50" fill="#EE7C2B" transform="translate(-35, -20) scale(0.5)"/>
  </g>
</svg>
