</div>
</div>

<h2 class="text-[#1b130d] dark:text-white tracking-tight text-[28px] font-bold leading-tight text-center pb-2">Como podemos ajudar?</h2>
<p class="text-[#1b130d]/70 dark:text-[#f3ece7]/80 text-base font-normal leading-relaxed text-center max-w-xs">

</div>

<div class="flex items-center gap-4 flex-1">
<div class="text-primary flex items-center justify-center rounded-full bg-primary/10 shrink-0 size-12 group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined">help</span>
</div>
<div class="flex flex-col items-start">
<p class="text-[#1b130d] dark:text-white text-base font-bold leading-normal truncate">Perguntas Frequentes</p>
<p class="text-[#1b130d]/50 dark:text-white/50 text-xs font-medium leading-normal">Tire dúvidas rápidas sobre o jogo</p>
</div>
</div>
<div class="shrink-0 text-[#1b130d]/30 dark:text-white/30">
<span class="material-symbols-outlined">chevron_right</span>

<span class="material-symbols-outlined">mail</span>
</div>
<div class="flex flex-col items-start">
<p class="text-[#1b130d] dark:text-white text-base font-bold leading-normal truncate">Enviar um E-mail</p>
<p class="text-[#1b130d]/50 dark:text-white/50 text-xs font-medium leading-normal">Resposta em até 24h</p>
</div>
</div>
<div class="shrink-0 text-[#1b130d]/30 dark:text-white/30">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
</div>
<div class="h-8"></div>

<div class="bg-surface-light dark:bg-surface-dark rounded-2xl p-5 shadow-sm border border-black/5 dark:border-white/5">
<h3 class="text-lg font-bold mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">edit_note</span>
                    Mensagem Rápida
                </h3>
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-[#1b130d]/50 dark:text-white/50 ml-2">Assunto</label>
<input class="w-full bg-background-light dark:bg-background-dark rounded-full border-transparent focus:border-primary focus:ring-primary h-12 px-4 text-sm dark:text-white placeholder:text-black/30 dark:placeholder:text-white/30 transition-all" placeholder="Sobre o que você quer falar?" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-[#1b130d]/50 dark:text-white/50 ml-2">Mensagem</label>
<textarea class="w-full bg-background-light dark:bg-background-dark rounded-2xl border-transparent focus:border-primary focus:ring-primary p-4 text-sm dark:text-white min-h-[100px] resize-none placeholder:text-black/30 dark:placeholder:text-white/30 transition-all" placeholder="Descreva seu problema..."></textarea>
</div>
<button class="mt-2 w-full bg-primary text-white font-bold h-12 rounded-full shadow-lg shadow-primary/30 flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all" type="button">
                        Enviar Mensagem
                        <span class="material-symbols-outlined text-sm">send</span>
</button>
</form>
</div>
<div class="h-8"></div>

<div class="flex flex-col items-center gap-4 mt-auto">
