</button>
<h1 class="text-text-primary dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Convidar Membros</h1>
</header>

<main class="flex-1 flex flex-col items-center px-6 pt-6 pb-24 overflow-y-auto no-scrollbar">

<div class="w-32 h-32 mb-6 relative">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl transform scale-75"></div>
<img alt="Cute stylized bird nest icon" class="w-full h-full object-cover rounded-2xl shadow-sm relative z-10 mask-squircle border-4 border-white dark:border-surface-dark" data-alt="Cute stylized bird nest icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyk2G9bQU8vzX8hEF1OV5tzBMmxrHjj2AXWg8J5PHWxnelBjI-gahDj0XcpJUDulOTTqLenKIEvJNX20QvBuUDqKQpvD0PPj2eyStTP7435YPBSR9v-JaI4BYPs4_e9PA50Q7Onm7wN-vYi7fBZ5-o8n_LWr5c7sP_8A7M4Td71ftjZVTftd3sGjkhnmMc4HnsGyE6tHcmUSc-8KtoG-SXPHzbik3U-JzVEJkw7Btmb6CdzGSX7UM4lL-_-wxYqZ5omM6GWTaqefdl"/>

<div class="absolute -top-2 -right-2 bg-white dark:bg-surface-dark p-1.5 rounded-full shadow-md z-20">
<span class="material-symbols-outlined text-primary text-xl">favorite</span>
</div>
</div>
<!-- Headline -->
<div class="text-center mb-8">
<h2 class="text-text-primary dark:text-white text-[28px] font-bold leading-tight mb-3 tracking-tight">Convide para o Ninho!</h2>
<p class="text-text-secondary dark:text-gray-300 text-base font-normal leading-relaxed max-w-[280px] mx-auto">
                    Traga sua família para o jogo! Envie o link abaixo para começarem a organizar a rotina juntos.
                </p>
</div>
<!-- Link Generation Card -->
<div class="w-full bg-white dark:bg-surface-dark rounded-xl p-5 shadow-sm border border-border-color dark:border-white/5 mb-8">
<label class="block text-xs font-bold text-text-placeholder uppercase tracking-wider mb-2 ml-1">Seu Link Único</label>
<div class="flex items-center gap-2 mb-4">
<div class="relative flex-1 group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary text-[20px]">link</span>
</div>
<input class="block w-full pl-10 pr-3 py-3.5 bg-background-light dark:bg-black/20 border-border-color dark:border-white/10 rounded-xl text-text-primary dark:text-white text-sm font-medium focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all truncate" readonly="" type="text" value="familynest.app/invite/8a29c..."/>
</div>
<button aria-label="Copiar link" class="flex items-center justify-center w-12 h-12 bg-primary/10 hover:bg-primary/20 text-primary rounded-xl transition-colors active:scale-95 shrink-0">
<span class="material-symbols-outlined text-2xl">content_copy</span>
</button>
</div>
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-white font-bold py-4 px-6 rounded-full transition-all shadow-lg shadow-primary/20 active:scale-95 text-base">
<span class="material-symbols-outlined">ios_share</span>
<span>Compartilhar Link</span>
</button>
</div>

<div class="relative w-full flex items-center gap-4 mb-8">
<div class="h-px bg-border-color dark:bg-white/10 flex-1"></div>
<span class="text-xs font-medium text-text-placeholder uppercase tracking-wider bg-background-light dark:bg-background-dark px-2">Ou por e-mail</span>
<div class="h-px bg-border-color dark:bg-white/10 flex-1"></div>
</div>

<div class="w-full space-y-4">
<div class="bg-white dark:bg-surface-dark rounded-xl p-1 shadow-sm border border-border-color dark:border-white/5 flex items-center focus-within:ring-2 focus-within:ring-primary/50 transition-all">
<div class="pl-4 text-text-placeholder">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-text-primary dark:text-white placeholder:text-text-placeholder py-3.5 px-3 text-base leading-normal w-full" placeholder="Digite o e-mail do familiar" type="email"/>
</div>
<button class="w-full flex items-center justify-center gap-2 bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 text-text-primary dark:text-white font-bold py-3.5 px-6 rounded-full border border-border-color dark:border-white/10 transition-colors active:scale-95">
<span>Enviar Convite</span>
</button>
</div>
</main>

<div class="h-6 w-full bg-background-light dark:bg-background-dark"></div>
