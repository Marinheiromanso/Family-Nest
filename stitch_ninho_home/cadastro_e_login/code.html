<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro e Login</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#36e27b",
              "background-light": "#f6f8f7",
              "background-dark": "#112117",
            },
            fontFamily: {
              "display": ["Spline Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white min-h-screen flex flex-col items-center justify-center p-4">
<!-- Mobile Container -->
<div class="w-full max-w-[400px] bg-background-light dark:bg-background-dark relative overflow-hidden flex flex-col gap-6">
<!-- Decorative Background Elements -->
<div class="absolute top-[-20%] right-[-20%] w-[300px] h-[300px] bg-primary/20 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[200px] h-[200px] bg-primary/10 rounded-full blur-[60px] pointer-events-none"></div>
<!-- Header / Branding -->
<div class="relative z-10 flex flex-col items-center pt-8 pb-2">
<div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center mb-4 shadow-sm border border-primary/10">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="diamond">diamond</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-center text-slate-900 dark:text-white">Premium Hub</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mt-1">Gerencie suas assinaturas</p>
</div>
<!-- Segmented Control Tabs -->
<div class="relative z-10 px-2">
<div class="flex p-1.5 bg-gray-200/80 dark:bg-gray-800/80 rounded-full backdrop-blur-sm">
<label class="flex-1 text-center cursor-pointer">
<input checked="" class="peer sr-only" name="auth_mode" type="radio" value="login"/>
<div class="py-2.5 rounded-full text-sm font-bold text-slate-500 dark:text-slate-400 transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-[0_2px_8px_rgba(0,0,0,0.08)]">
                        Login
                    </div>
</label>
<label class="flex-1 text-center cursor-pointer">
<input class="peer sr-only" name="auth_mode" type="radio" value="register"/>
<div class="py-2.5 rounded-full text-sm font-bold text-slate-500 dark:text-slate-400 transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-[0_2px_8px_rgba(0,0,0,0.08)]">
                        Criar Conta
                    </div>
</label>
</div>
</div>
<!-- Content Area -->
<div class="relative z-10 flex flex-col gap-5 px-2">
<!-- Headline -->
<div class="text-center py-2">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white">Bem-vindo de volta</h2>
</div>
<!-- Inputs -->
<div class="space-y-4">
<div class="group/field">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-3 mb-1.5">E-mail ou Usuário</label>
<div class="relative flex items-center">
<input class="form-input w-full h-14 pl-11 pr-4 bg-white dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-full text-base placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" placeholder="nome@exemplo.com" type="text"/>
<span class="material-symbols-outlined absolute left-4 text-slate-400 group-focus-within/field:text-primary transition-colors" data-icon="mail">mail</span>
</div>
</div>
<div class="group/field">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-3 mb-1.5">Senha</label>
<div class="relative flex items-center">
<input class="form-input w-full h-14 pl-11 pr-12 bg-white dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-full text-base placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute left-4 text-slate-400 group-focus-within/field:text-primary transition-colors" data-icon="lock">lock</span>
<button class="absolute right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end pr-2">
<a class="text-sm font-semibold text-primary hover:text-green-500 transition-colors" href="#">Esqueci minha senha</a>
</div>
</div>
<!-- Main Action -->
<button class="w-full h-14 mt-2 bg-primary hover:bg-[#2fe075] active:scale-[0.99] rounded-full text-slate-900 text-lg font-bold shadow-[0_4px_14px_rgba(54,226,123,0.4)] transition-all flex items-center justify-center gap-2 group">
                Entrar
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2 opacity-80">
<div class="h-px flex-1 bg-gradient-to-r from-transparent via-gray-300 dark:via-gray-600 to-transparent"></div>
<span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ou entre com</span>
<div class="h-px flex-1 bg-gradient-to-r from-transparent via-gray-300 dark:via-gray-600 to-transparent"></div>
</div>
<!-- Social Buttons -->
<div class="flex justify-center gap-4 pb-6">
<button class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm transition-all hover:border-gray-300 dark:hover:border-gray-600 hover:-translate-y-0.5">
<svg class="h-6 w-6" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<div class="absolute inset-0 rounded-full bg-slate-100 dark:bg-white/5 opacity-0 transition-opacity group-hover:opacity-100"></div>
</button>
<button class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm transition-all hover:border-gray-300 dark:hover:border-gray-600 hover:-translate-y-0.5">
<svg class="h-6 w-6 fill-slate-900 dark:fill-white" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74 1.18 0 2.45-1.02 3.67-.89 1.44.15 2.54.91 3.23 2.06-2.63 1.6-2.17 5.75.52 6.99-.44 1.25-1.03 2.58-2.5 4.07zm-5.21-17.5c1.67-.18 3.03 1.05 3.43 2.62-1.63.13-3.24-1.01-3.43-2.62z"></path>
</svg>
<div class="absolute inset-0 rounded-full bg-slate-100 dark:bg-white/5 opacity-0 transition-opacity group-hover:opacity-100"></div>
</button>
</div>
</div>
</div>
</body></html>
