<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contato com Suporte</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#137fec",
                "background-light": "#f6f7f8",
                "background-dark": "#101922",
                },
                fontFamily: {
                "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<div class="flex items-center px-4 py-3 justify-between sticky top-0 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm z-50">
<button class="text-[#111418] dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full active:bg-gray-200 dark:active:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] text-center">Suporte</h2>
<div class="size-10"></div> <!-- Spacer for center alignment -->
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col max-w-[640px] mx-auto w-full">
<!-- Headline -->
<div class="px-4 pt-4 pb-2">
<h2 class="text-[#111418] dark:text-white tracking-tight text-[28px] font-bold leading-tight text-left">
                    Como podemos ajudar?
                </h2>
</div>
<!-- Body Text -->
<div class="px-4 pb-6">
<p class="text-[#617589] dark:text-gray-400 text-base font-normal leading-relaxed">
                    Descreva seu problema com a assinatura ou plano. Nossa equipe geralmente responde em até 24h.
                </p>
</div>
<!-- Form -->
<div class="flex flex-col gap-5 px-4">
<!-- Subject Input -->
<label class="flex flex-col w-full">
<p class="text-[#111418] dark:text-white text-sm font-semibold leading-normal pb-2 ml-1">Assunto</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111418] dark:text-white border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-[#1a2634] h-14 placeholder:text-[#9ca3af] p-[15px] text-base font-normal leading-normal focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" placeholder="Ex: Problema na cobrança" value=""/>
</div>
</label>
<!-- Message Input -->
<label class="flex flex-col w-full">
<div class="flex justify-between items-end pb-2 ml-1">
<p class="text-[#111418] dark:text-white text-sm font-semibold leading-normal">Mensagem</p>
<span class="text-xs text-[#9ca3af]">Máx. 500 caracteres</span>
</div>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none rounded-xl text-[#111418] dark:text-white border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-[#1a2634] min-h-[180px] placeholder:text-[#9ca3af] p-[15px] text-base font-normal leading-normal focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" placeholder="Descreva o que aconteceu com detalhes..."></textarea>
</label>
</div>
<!-- Spacer -->
<div class="flex-1 min-h-[40px]"></div>
<!-- Action Area -->
<div class="p-4 pb-8 mt-auto w-full">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-md hover:bg-blue-600 active:scale-[0.98] transition-all">
<span class="truncate">Enviar Solicitação</span>
</button>
<!-- FAQ Link -->
<div class="flex justify-center mt-6">
<a class="flex items-center gap-2 text-primary text-sm font-medium hover:underline" href="#">
<span class="material-symbols-outlined text-[18px]">help</span>
                        Ver perguntas frequentes
                    </a>
</div>
</div>
</div>
</div>
</body></html>
