<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Family Nest - Onboarding</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecc8",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221f",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d1b19] dark:text-white overflow-hidden select-none">
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl overflow-hidden bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between shrink-0 z-10">
<button class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="ArrowLeft">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Adicione a Família</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-32">
<!-- Headline & Description -->
<div class="pt-4 pb-6">
<h2 class="text-[28px] font-bold leading-tight tracking-tight mb-3 text-center text-[#0d1b19] dark:text-white">
                    Quem faz parte do <br/><span class="text-primary">seu ninho?</span>
</h2>
<p class="text-base text-gray-500 dark:text-gray-400 font-normal leading-relaxed text-center px-4">
                    Traga todos para o ninho para dividir as tarefas. Toque abaixo para adicionar.
                </p>
</div>
<!-- Current Nest Members List -->
<div class="space-y-4 mb-8">
<div class="flex items-center justify-between text-sm font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider px-2">
<span>Membros do Ninho</span>
<span>2/6</span>
</div>
<!-- Member Card: User (Me) -->
<div class="group flex items-center gap-4 p-3 bg-white dark:bg-white/5 rounded-2xl shadow-sm border border-gray-100 dark:border-white/5 transition-transform active:scale-[0.98]">
<div class="relative shrink-0">
<div class="size-14 rounded-full bg-[#e7f3f1] dark:bg-primary/20 border-2 border-white dark:border-white/10 bg-center bg-cover" data-alt="Avatar of a smiling person with glasses" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCafDcj8f40UnlLjZVaiIk7YxHdz5eiOgyA5WgduQQKcF2Dh-MB0LUV406BKaiaW0_1MWVAdldfwMKq1F5dMZ1YeFzdYy_6tetaCbTZmm2DbsaY64rK1TgVGkRCwWoj0zjKA2zK1rLrnk6GZ7-7mbsOqj5jSI0YKSKsqTIlQ64DlRscXgj_OA46czI5FgMb5GHeqDOIruLeECsyRMxJ8Df8b3fhl3Qpo9sOWVlJa53-_WR_aAV_pOVaHFl8bb9Dq9ZRcBC0YOQBKyQ_');">
</div>
<div class="absolute -bottom-1 -right-1 bg-primary text-[#10221f] text-[10px] font-bold px-2 py-0.5 rounded-full border border-white dark:border-[#10221f]">
                            VOCÊ
                        </div>
</div>
<div class="flex-1 min-w-0">
<h4 class="text-lg font-bold truncate">Mariana</h4>
<p class="text-sm text-gray-500 dark:text-gray-400">Admin do Ninho</p>
</div>
<button class="size-10 flex items-center justify-center text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
<!-- Member Card: Partner -->
<div class="group flex items-center gap-4 p-3 bg-white dark:bg-white/5 rounded-2xl shadow-sm border border-gray-100 dark:border-white/5 transition-transform active:scale-[0.98]">
<div class="shrink-0">
<div class="size-14 rounded-full bg-[#fcf4e8] dark:bg-orange-500/20 text-orange-400 flex items-center justify-center border-2 border-white dark:border-white/10">
<span class="material-symbols-outlined text-3xl">face_3</span>
</div>
</div>
<div class="flex-1 min-w-0">
<h4 class="text-lg font-bold truncate">Carlos</h4>
<p class="text-sm text-gray-500 dark:text-gray-400">Parceiro</p>
</div>
<button class="size-10 flex items-center justify-center text-gray-400 hover:text-red-400 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Input Area -->
<div class="relative flex flex-col gap-4">
<label class="block text-sm font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider px-2">
                    Adicionar Novo
                </label>
<!-- New Member Input -->
<div class="flex items-center gap-3 p-1.5 bg-white dark:bg-white/5 rounded-full border border-gray-200 dark:border-white/10 shadow-sm focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
<div class="size-11 rounded-full bg-gray-100 dark:bg-white/10 text-gray-400 flex items-center justify-center shrink-0 ml-1">
<span class="material-symbols-outlined">person_add</span>
</div>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-base placeholder:text-gray-400 text-[#0d1b19] dark:text-white px-2" placeholder="Nome do membro..." type="text"/>
<button class="size-11 rounded-full bg-primary text-[#10221f] flex items-center justify-center hover:bg-primary/90 transition-colors shrink-0">
<span class="material-symbols-outlined font-bold">add</span>
</button>
</div>
<!-- Suggestions Chips -->
<div class="flex flex-wrap gap-2 px-1">
<button class="px-4 py-2 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:border-primary hover:text-primary active:bg-primary/5 transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-lg">child_care</span>
                        Filho(a)
                    </button>
<button class="px-4 py-2 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:border-primary hover:text-primary active:bg-primary/5 transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-lg">pets</span>
                        Pet
                    </button>
<button class="px-4 py-2 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:border-primary hover:text-primary active:bg-primary/5 transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-lg">favorite</span>
                        Parceiro(a)
                    </button>
<button class="px-4 py-2 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:border-primary hover:text-primary active:bg-primary/5 transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-lg">diversity_3</span>
                        Outro
                    </button>
</div>
</div>
</div>
<!-- Footer / CTA -->
<div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-12">
<button class="w-full h-16 rounded-full bg-primary text-[#10221f] font-bold text-lg shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                Vamos Começar!
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
